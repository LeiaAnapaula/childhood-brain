<!doctype html>
<html lang="en">

<title>Which childhood is yours</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&display=swap">
<style>
  :root { --paper:#EEF1F4; --ink:#141A21; --mute:#5C6773; --line:#C9D1DA; --pick:#1D3B8B; --pickink:#F6F8FB; --field:#FFFFFF;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#14181D; --ink:#EEF1F4; --mute:#9AA6B2; --line:#2E3742; --pick:#8FA8F2; --pickink:#0E1420; --field:#1C222A; } }
  :root[data-theme="dark"] { --paper:#14181D; --ink:#EEF1F4; --mute:#9AA6B2; --line:#2E3742; --pick:#8FA8F2; --pickink:#0E1420; --field:#1C222A; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }

  html,body { margin:0; background:var(--paper); color:var(--ink); font-family:Manrope,"Helvetica Neue",Arial,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:72px 24px 96px; }
  #back { position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; width:44px; height:44px; border-radius:22px; border:1px solid var(--line); background:var(--field); color:var(--ink); font-size:22px; line-height:1; cursor:pointer; visibility:hidden; z-index:10; display:flex; align-items:center; justify-content:center; }
  #back:hover, #back:focus-visible { border-color:var(--pick); outline:none; }

  button.opt { text-align:left; background:transparent; border:1px solid var(--line); border-radius:4px; padding:18px 20px; font:inherit; font-size:17px; line-height:1.4; color:var(--ink); cursor:pointer; }
  button.opt strong { display:block; font-weight:700; margin-bottom:4px; }

  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px }
  input { font:inherit; font-size:17px; padding:14px 16px; border:1px solid var(--line); border-radius:4px; width:100%; background:var(--field); color:var(--ink); margin-bottom:12px; }
  textarea { font:inherit; font-size:17px; line-height:1.45; padding:14px 16px; border:1px solid var(--line); border-radius:4px; width:100%; min-height:150px; resize:vertical; background:var(--field); color:var(--ink); margin-bottom:12px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { font:inherit; font-size:15px; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  .chip.on { background:var(--pick); color:var(--pickink); border-color:var(--pick); }
  .chip:focus-visible { outline:2px solid var(--pick); outline-offset:2px; }
  .lora li .k { color:var(--mute); }
  .note { color:var(--mute); font-size:14px; margin-top:40px; line-height:1.5; }

  @media (prefers-reduced-motion:no-preference) { .fade { animation:in .35s ease } @keyframes in { from{opacity:0} to{opacity:1} } }

<script>
const SEEDS = {
  parents: [
    {slug:"provider",name:"The Father as Order",text:"Present through rules, money, and silence. Love was structure. You learned that being provided for and being seen are different things."},
    {slug:"protector",name:"The Devouring Mother",text:"Love that held too tight. Every danger narrated, every step watched. You learned to carry their fear before you could carry your own."},
    {slug:"golden",name:"The Hero-Maker",text:"You were their proof. Love arrived with achievement and left with failure. You became the family's myth and hid the child."},
    {slug:"absent",name:"The Absent God",text:"Gone, or there and not there. You built an image to talk to. The image became more real than the person."},
    {slug:"friend",name:"The Eternal Child",text:"A parent who never grew up. You heard adult secrets at nine and became the grown-up in the house."},
    {slug:"striver",name:"The Sacrificer",text:"Everything given, nothing said. Debt was the family's language. You learned that love is measured in what it costs."},
    {slug:"constant",name:"The Great Mother",text:"Nourishing, steady, unremarkable. Feelings had a place to land. You did not know it was rare until you left."},
    {slug:"storm",name:"The Shadow in the House",text:"Moods no one named. You became a reader of doors and footsteps. Your intuition was born as a survival skill."}
  ],
  schools: [
    {slug:"public",name:"The big public school",text:"Buses, tests, a gifted track, and a lunch table that decided your rank."},
    {slug:"religious",name:"The small religious school",text:"Uniforms, prayer, one teacher who knew your whole family. Shame and belonging arrived together."},
    {slug:"underfunded",name:"The underfunded school",text:"Broken things, one great teacher who stayed, a library that closed early. You got sharp early."},
    {slug:"elite",name:"The elite school",text:"Everyone's parent was someone. You learned what money sounds like when it is quiet."},
    {slug:"village",name:"The everyone-since-kindergarten school",text:"Forty-minute ride, same faces for twelve years. Leaving was the plan or the sin."}
  ],
  events: [
    {slug:"seen",name:"One adult saw you",text:"A teacher, coach, or neighbor said one sentence you are still living up to."},
    {slug:"responsibility",name:"Early responsibility",text:"You raised a sibling or ran the house before you were twelve."},
    {slug:"move",name:"The move",text:"A city, a country, a language. You arrived as the new kid and never fully unpacked."},
    {slug:"trait",name:"Praise for one trait",text:"Smart. Pretty. Strong. Funny. You became the trait and hid the rest."},
    {slug:"rupture",name:"The rupture",text:"Divorce, a death, a departure. The house had a before and an after."},
    {slug:"humiliation",name:"Public humiliation",text:"One moment in front of everyone. You decided something about visibility that day."},
    {slug:"loved-alone",name:"First thing you loved alone",text:"A book, a game, a sky. Nobody gave it to you and nobody could take it."},
    {slug:"money",name:"Money went away",text:"A layoff, a lost house, a quiet downgrade. You learned to notice prices."},
    {slug:"secret",name:"The secret",text:"Something in the family nobody said out loud. You learned to hold what could not be held."},
    {slug:"translator",name:"Being the translator",text:"Between languages, between parents, between worlds. You became the bridge."},
    {slug:"win",name:"The win",text:"A trophy, a scholarship, a stage. For one day the family story was about you, and it was good."},
    {slug:"illness",name:"The illness",text:"Yours or theirs. Waiting rooms. Learning that bodies can fail."},
    {slug:"friend-left",name:"The friend who left",text:"The first person you chose who chose someone else."},
    {slug:"forgiven",name:"Caught and forgiven",text:"You did the wrong thing, got caught, and were loved anyway. Repair became possible."},
    {slug:"shamed",name:"Caught and shamed",text:"You did the wrong thing and it became who you were for a year. You learned to hide."},
    {slug:"summer",name:"The long summer alone",text:"Weeks with no one home. You built a world to live in."},
    {slug:"grandparent",name:"The grandparent",text:"One older person who had time. Their kitchen was the safest room in the world."},
    {slug:"comparison",name:"The comparison",text:"A sibling or cousin who was the standard. You measured yourself in someone else's units."},
    {slug:"first-no",name:"The first no",text:"You refused something everyone expected. It cost you and it made you."},
    {slug:"needed",name:"Being needed",text:"Someone relied on you and you liked it more than you should have. Usefulness became love."}
  ]
};


// Repertoire: parents + school + events -> fragment. 25 childhoods.
const REPERTOIRE = [
{links:["provider","constant","public","trait","win","friend-left"],text:"The garage door was how you knew he was home. Your mother kept the calendar on the fridge and the peace in the house, and dinner happened whether or not anyone spoke. You were the smart one, which the neighbors said before you could spell it, so you stopped bringing home anything that was not an A. The science fair trophy sat on the counter for a week and your father touched it once, on his way past. In eighth grade your best friend found a louder table and did not look back. You still notice who saves you a seat."},
{links:["storm","absent","underfunded","responsibility","seen","summer"],text:"You learned the sound of his keys before you learned to read. When he left for good the apartment got quieter and you got older in a month: cereal for your brother, the lie to the landlord, homework at the laundromat. One teacher kept you after class once and said, you are going to be fine, and you decided to believe a stranger over your own house. The summers were long and empty and you filled them with a whole city you drew on the back of flyers. You still build places to live in when the real one is loud."},
{links:["golden","protector","elite","comparison","humiliation","first-no"],text:"Your mother introduced you by your test scores. Your father drove you to school with the doors locked and the news on, and every story ended with what could happen to a kid like you. Your cousin was the standard: earlier, taller, admitted first. In tenth grade you froze in the middle of a speech in front of the whole assembly and someone laughed, and you decided visibility was a thing that happened to other people. Senior year you turned down the school they had picked. Nobody spoke at dinner for a week. It was the first thing that was yours."},
{links:["friend","storm","village","secret","loved-alone","needed"],text:"Your mother told you about the divorce before she told your father. You were nine. The house had weather, and you learned to forecast it from the way the car door shut. Everyone at school had known you since kindergarten, which meant nobody could see that anything was wrong, which is what your family wanted. You found astronomy in the school library at eleven and the sky became the only thing in your life that did not need managing. Being needed was the closest thing to being loved, so you became very good at it."},
{links:["striver","constant","religious","translator","money","grandparent"],text:"Two languages, one at the kitchen table and one at the front door, and you were the door. You read the mortgage letters out loud at eight and translated the bad parts into something gentler. The school was small and the uniform was itchy and one nun knew your whole family, which was mostly a comfort. When the restaurant closed you learned what things cost by watching your mother's face at the register. Your grandmother's kitchen was two blocks away and smelled like cumin and had no problems in it. You still go somewhere small to feel safe."},
{links:["striver","constant","public","translator","win","grandparent"],text:"The combi stopped in front of the house before six and your father was already on it. Your mother packed two lunches and one was yours. School was concrete and noise and a teacher who taught forty of you with one chalk, and you were the one who explained the English homework to the others. When you won the district olympiad your abuela lit a candle and told the whole street. The kitchen in her house had a tin roof that sang in the rain and no bad news ever entered it. You are still translating one world to another and you still hear the roof."},
{links:["provider","storm","religious","comparison","secret","loved-alone"],text:"Your father owned the store and the store owned him. Your mother's moods decided what kind of night it would be, and you could tell from the sound of her heels in the corridor. At the colegio the nuns compared you to your sister out loud. There was something about your uncle nobody said and everyone knew, and you learned to hold it like a hot plate. On the roof at night with a borrowed book of constellations you found the first thing that belonged only to you. You still climb somewhere high when the house gets loud."},
{links:["absent","protector","underfunded","responsibility","move","seen"],text:"He went north for work and came back as a voice on Sundays. Your mother held your hand crossing every street until you were twelve and told you every story about a girl who was not careful. The school in Chosica had one good teacher, Señor Paredes, who told you once that you had a mind like a river, and you carried the sentence to Lima when the family moved and then further. You raised your brother in the afternoons while your mother sold at the market. You arrived everywhere as the new one. You still have not fully unpacked."},
{links:["golden","friend","elite","trait","humiliation","first-no"],text:"You were la inteligente before you were anything else, and your mother said it at every table. Your father talked to you about money and his marriage like you were his lawyer. At the private school in La Molina everyone's father was somebody and you learned what quiet money sounds like. In tercero you answered wrong in front of the whole class and the teacher let the silence run, and something in you decided to never be seen guessing again. At seventeen you said no to the career they had chosen. It cost you a year of dinners. It made you."},
{links:["constant","constant","village","forgiven","illness","needed"],text:"Both of your parents were home by seven and it did not seem like anything. The school was the same forty faces for twelve years and the whole neighborhood knew when you scraped your knee. When you broke the neighbor's window and lied about it, your father took you to apologize and then bought you an ice cream, and you learned that being caught was survivable. Your mother was sick the year you turned eleven and the house learned to need you. You liked it more than you should have. You still confuse being useful with being loved."},
{links:["golden","protector","public","trait","comparison","win"],text:"Your marks were announced at family dinners before the food. Your mother kept you home when it rained and told you what could happen to a child in the city. At the municipal school you were the topper and the class was sixty and the fan did not work. Your cousin in Pune was the measure of everything, and every phone call ended with his percentage. When you won the state olympiad your father called everyone he had ever met. For a day the family story was about you. You still confuse a good result with being loved."},
{links:["striver","constant","underfunded","translator","money","grandparent"],text:"Your father took the 7:04 local and came back on the 8:40. Your mother kept the house running on a number she never said out loud. The school had a broken gate and one teacher who stayed late for you. You filled out every English form for the family before you were ten. When the business failed you learned what prices meant from the way your mother touched vegetables at the market. Your dadi's kitchen was the one room with no arithmetic in it. You still go looking for rooms like that."},
{links:["storm","absent","religious","secret","loved-alone","summer"],text:"Your father's temper arrived before he did, and you learned to read the stairwell. Your mother was there the way a photograph is there. At the convent school everyone prayed in the same direction and the nuns knew your family's name and something else about it that nobody said. You found a chess book in a cupboard at ten and it was the first thing that was entirely yours. The summers were long and the flat was empty and you built whole tournaments in your head. You still go inside your own head when the room is loud."},
{links:["friend","provider","elite","humiliation","friend-left","first-no"],text:"Your mother told you about your father's debts before she told anyone else. You were nine and you understood the interest. He worked and paid and did not speak. At the international school every parent had a driver and you learned which cars meant which money. In eighth standard you were called out in assembly for something you did not do, and the not-doing did not matter. Your best friend chose the loud table. At seventeen you refused the engineering seat. Your father did not speak for a month. It was the first thing you owned."},
{links:["protector","constant","village","responsibility","illness","seen"],text:"Your mother held your wrist crossing every road and told you the news at bedtime as a warning. Your father came home at six with fruit. The school was a lane away and everyone had known you since you were three. When your grandfather got sick you were the one who slept at the hospital, twelve years old with a schoolbag. One teacher kept you back after class and said one sentence about your mind that you have not stopped trying to deserve. You still show up for the people who did not ask."},
{links:["golden","provider","elite","trait","comparison","humiliation"],text:"Your mother told the relatives your scores before they sat down. Your father left before you woke and came home after you slept and paid for everything, which was how he said it. At the key school everyone's parent was someone. Your cousin was the unit you were measured in. In the year you were eleven you read the wrong answer aloud in front of the whole class and the teacher let the silence do the work. You decided that day about being seen. You are still the smart one and you are still hiding the rest."},
{links:["absent","striver","public","grandparent","translator","first-no"],text:"Your parents worked in another city and came home for Spring Festival with gifts and jet lag. Your grandmother raised you in a two-room flat with a rice cooker that sang. The school was crowded and hot and you were the one who read the notices to the older neighbors. You explained your grandmother to your parents and your parents to your grandmother. At eighteen you refused the major they chose on the phone. Your grandmother said nothing and made your favorite soup. It is still the only room you feel safe in."},
{links:["protector","constant","religious","loved-alone","secret","win"],text:"Your mother knew the temperature of every room you would enter. Your father was steady and quiet and always there at dinner. At school there was a thing about your family's past that the teachers knew and nobody said. You found a shortwave radio in a drawer at nine and the voices from far away became the first thing that was only yours. When you won the provincial competition your mother cried and your father nodded and you understood the nod was a speech. You still listen for far-away voices when the room gets close."},
{links:["storm","friend","underfunded","responsibility","money","shamed"],text:"Your father's moods came up the stairwell ahead of him. Your mother told you about the money before she told him you knew. When the factory closed you were ten and you learned what a price was from her face at the market. The school had broken windows and one teacher who stayed. You did the shopping and the forms and your sister's hair. When you were caught cheating on a test you did not need to cheat on, it became your name for a year. You learned to hide well. You are still very good at it."},
{links:["constant","constant","village","forgiven","friend-left","needed"],text:"Dinner was at six and both of your parents were at it. The same forty faces from kindergarten to the gaokao. When you broke the neighbor's bicycle and lied, your father took you to say sorry and then bought dumplings, and you learned that being caught was survivable. The friend you chose in year four chose someone else in year seven. Your little brother needed you for everything and you liked it more than you should have. You still feel most loved when you are most useful."},
{links:["striver","constant","public","translator","grandparent","win"],text:"Your father left for the second job before you left for school. Your mother made the house run on a number she kept in her head. The primaria was loud and full and had one teacher with one piece of chalk, and you explained the English homework to the whole row. When you won the concurso your abuela told the entire colonia and lit a candle for the Virgen. Her kitchen smelled like epazote and had no problems in it. You still translate one world into another and you still look for that kitchen."},
{links:["provider","storm","religious","secret","comparison","loved-alone"],text:"Your father owned the taller and the taller owned him. Your mother's moods decided the weather at dinner and you could read them from her heels in the hallway. At the colegio the madres compared you to your sister in front of everyone. There was a thing about your uncle that the whole family knew and nobody said. On the azotea at night with a borrowed book of maps you found the first thing that belonged only to you. You still climb somewhere high when the house gets loud."},
{links:["absent","protector","underfunded","move","responsibility","seen"],text:"He went to the north for work and became a voice on Sundays. Your mother held your hand at every crossing until you were twelve and told you stories about girls who were not careful. The school in Iztapalapa had one teacher who told you once that you had a mind like a river, and you carried that sentence through the move to Coyoacán and further. You raised your brother in the afternoons while your mother sold at the tianguis. You arrived everywhere as the new one. You still have not fully unpacked."},
{links:["golden","friend","elite","trait","humiliation","first-no"],text:"You were la inteligente before you were anything else and your mother said it at every table. Your father talked to you about money and his marriage as if you were his accountant. At the private school in Las Lomas every father was somebody and you learned what quiet money sounds like. In secundaria you answered wrong in front of the whole class and the teacher let the silence run, and something in you decided to never be seen guessing again. At seventeen you refused the career they had chosen. It cost you a year of Sunday dinners. It made you."},
{links:["constant","friend","village","forgiven","illness","needed"],text:"Both of your parents were home by seven and it never seemed like anything. Your mother talked to you like a friend a little too early. The school was the same forty faces for twelve years and the whole colonia knew when you scraped your knee. When you broke the neighbor's window and lied, your father took you to apologize and then bought you a paleta, and you learned that being caught was survivable. Your mother got sick the year you turned eleven and the house learned to need you. You liked it more than you should have. You still confuse being useful with being loved."}
];
const app = document.getElementById('app');
let picks = [], stage = 0, name = '', city = '', askMove = false, alive = [], pendingName = null, money = '', social = '';
const history = [];
const drafts = {};
const keep = (inp, k) => { inp.value = drafts[k] ?? inp.value; inp.addEventListener('input', () => drafts[k] = inp.value); };
const snap = () => history.push(JSON.stringify({ picks, stage, name, city, askMove, alive, pendingName, money, social }));
function back() {
  if (!history.length) return;
  const s = JSON.parse(history.pop());
  ({ picks, stage, name, city, askMove, alive, pendingName, money, social } = s);
  render();
}
document.getElementById('back').onclick = back;
const pool = () => REPERTOIRE;
const shuffle = a => [...a].sort(() => Math.random() - .5);
const ROLES = ['Mom','Dad','Stepmom','Stepdad','Grandma','Grandpa','Other'];
const isParent = p => SEEDS.parents.some(x => x.slug === p.slug);
const isSchool = p => SEEDS.schools.some(x => x.slug === p.slug);
const namedParents = () => picks.filter(p => isParent(p) && p.who);
// "your dad Carlos" the first time, "Carlos" after. A parent marked Other is just their name.
const personLabel = (p, first = true) => !p.role || p.role === 'Other' ? p.who : (first ? 'your ' + p.role.toLowerCase() + ' ' + p.who : p.who);
const rounds = [
  { key:'parents', title:'Who was the first adult in your house?', q:'Closest, not perfect.' },
  { key:'parents', title:'And the second one, or the one who was missing.', q:'Closest again.' },
  { key:'schools', title:'Where did you learn your rank?', q:'The school.' },
  { key:'events',  title:'What changed how you weighed everything after?', q:'One, if any.',
    slugs:['rupture','move','money','illness','humiliation','win','friend-left','forgiven','shamed'] },
  { key:'events',  title:'What did you refuse to become?', q:'A person, or a feeling that wanted to run you. Or none of these.', fixed:true,
    slugs:['comparison','shamed','humiliation','first-no','needed'],
    as:{
      comparison:{ name:'Their standard', text:'A sibling or cousin was the measure. You refused to keep living in their units.' },
      shamed:{ name:'Ruled by shame', text:'You were caught, or told, and it stuck for a year. You refused to let shame decide what you say out loud.' },
      humiliation:{ name:'The one who hides', text:'One moment in front of everyone. You refused to become the person who stays small so it never happens again.' },
      'first-no':{ name:'Their script', text:'The school, the career, the life they picked. You refused it. It cost you and it made you.' },
      needed:{ name:'Only useful', text:'Someone relied on you and it felt like love. You refused to let being needed be the whole of you.' }
    } },
  { key:'events',  title:'What did you carry that was not yours?', q:'Or none of these.',
    slugs:['secret','translator','responsibility','needed','money','illness','trait'] },
  { key:'events',  title:'What have you never put down?', q:'Or none of these.',
    slugs:['loved-alone','seen','grandparent','summer','win','trait','first-no','comparison'] },
];
const STORIES = [
  { key:'money', step:'Money', title:'One specific money story.', q:'The moment you learned what things cost in your house. The bill on the table, the thing you stopped asking for, the year it changed. Two or three sentences, as it happened.', ph:'The year the shop closed my mom started counting out coins at the register and I stopped asking for the field trip.' },
  { key:'social', step:'Where you stood', title:'One specific social story.', q:'The table, the room, or the friend where you learned your place among other kids. Who was there, what was said. Two or three sentences.', ph:'In sixth grade Priya moved to the loud table at lunch and did not save me a seat. I ate in the library for the rest of the year.' },
];
const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function bestSplit(options) {
  const p = alive.length ? alive : pool();
  return options.map(o => {
    const yes = p.filter(c => c.links.includes(o.slug)).length;
    return { o, bal: Math.abs(yes / Math.max(p.length,1) - 0.5), yes };
  }).sort((a,b) => (b.yes>0) - (a.yes>0) || a.bal - b.bal).slice(0,4).map(x => x.o);
}
function narrow(o) { const p = alive.length ? alive : pool(); const n = p.filter(c => c.links.includes(o.slug)); alive = n.length ? n : p; }
function score(c, ps) { return ps.reduce((s,p) => s + (c.links.includes(p.slug) ? 1 : 0), 0); }
function match() { const p = pool(); return [...p].sort((a,b) => score(b,picks) - score(a,picks))[0]; }

function storyStep(s) {
  const cur = s.key === 'money' ? money : social;
  app.innerHTML = `<div class="fade"><p class="step">${s.step}</p><h1>${s.title}</h1><p class="q">${s.q}</p><textarea id="st" placeholder="${esc(s.ph)}">${esc(cur)}</textarea><div class="row"><button class="cta" id="ok">Keep going</button><button class="cta ghost" id="skip">Skip</button></div></div>`;
  keep(app.querySelector('#st'), 'story:' + s.key);
  const set = v => { if (s.key === 'money') money = v; else social = v; };
  app.querySelector('#ok').onclick = () => { const v = app.querySelector('#st').value.trim(); snap(); set(v); drafts['story:' + s.key] = v; stage++; render(); };
  app.querySelector('#skip').onclick = () => { snap(); set(''); delete drafts['story:' + s.key]; stage++; render(); };
}
function render() {
  document.getElementById('back').style.visibility = history.length ? 'visible' : 'hidden';
  if (!city) {
    app.innerHTML = `<div class="fade"><h1>Where did you grow up?</h1><p class="q">A city, a town, or "somewhere smaller". It goes on your page as one fact.</p><input id="ct" autofocus placeholder="City" value="${esc(city)}"><button class="cta" id="ctc">Keep going</button></div>`;
    keep(app.querySelector('#ct'), 'city');
    const done = () => { const v = app.querySelector('#ct').value.trim(); if (!v) return; snap(); city = v; askMove = true; render(); };
    app.querySelector('#ctc').onclick = done;
    app.querySelector('#ct').addEventListener('keydown', e => { if (e.key === 'Enter') done(); });
    return;
  }
  if (askMove) {
    app.innerHTML = `<div class="fade"><p class="step">${esc(city)}</p><h1>Did you move before you were eighteen?</h1><p class="q">A city, a country, a language.</p><div class="opts"></div></div>`;
    const box = app.querySelector('.opts');
    const no = el(`<button class="opt"><strong>No, that was it</strong></button>`); no.onclick = () => { snap(); askMove = false; render(); }; box.appendChild(no);
    const yes = el(`<button class="opt"><strong>Yes</strong>You arrived as the new kid.</button>`); yes.onclick = () => { snap(); askMove = false; const mv = SEEDS.events.find(e => e.slug === 'move'); const p = {...mv}; picks.push(p); narrow(mv); pendingName = p; render(); }; box.appendChild(yes);
    return;
  }
  // 2. after a pick, ask for the specific person or place
  if (pendingName) {
    const o = picks[picks.length - 1] || pendingName;
    const isP = isParent(o), isS = isSchool(o);
    if (isP) {
      // Parents get a name and a role, so the childhood can say "your dad Carlos" instead of "he".
      let role = o.role || '';
      app.innerHTML = `<div class="fade"><p class="step">${esc(o.name)}</p><h1>Who was this? Their name.</h1><p class="q">First name, or what you called them. Your childhood will say it back to you: "your dad Carlos", never "he".</p><div class="chips" id="roles"></div><input id="who" autofocus placeholder="Their name" value="${esc(o.who || '')}"><div class="row"><button class="cta" id="ok">${o.who ? 'Save' : 'Keep going'}</button><button class="cta ghost" id="skip">${o.who ? 'Clear' : 'Skip'}</button></div></div>`;
      const chips = app.querySelector('#roles');
      const draw = () => { chips.innerHTML = ''; for (const r of ROLES) { const b = el(`<button type="button" class="chip${r === role ? ' on' : ''}" aria-pressed="${r === role}">${r}</button>`); b.onclick = () => { role = r; draw(); app.querySelector('#who').focus(); }; chips.appendChild(b); } };
      draw();
      keep(app.querySelector('#who'), 'who:' + o.slug);
      const done = () => { const v = app.querySelector('#who').value.trim(); snap(); o.who = v; o.role = v ? role : ''; drafts['who:' + o.slug] = v; pendingName = null; render(); };
      app.querySelector('#ok').onclick = done; app.querySelector('#skip').onclick = () => { snap(); o.who = ''; o.role = ''; delete drafts['who:' + o.slug]; pendingName = null; render(); };
      app.querySelector('#who').addEventListener('keydown', e => { if (e.key === 'Enter') done(); });
      return;
    }
    const ask = o.slug === 'seen' ? 'Who was it? Their name.' : o.slug === 'comparison' ? 'Who was the standard? Their name.' : o.slug === 'shamed' || o.slug === 'humiliation' ? 'Who was there, or where was it?' : o.slug === 'first-no' ? 'What did you refuse?' : o.slug === 'needed' ? 'Who needed you?' : isS ? 'What was the school called?' : 'Who, or where?';
    app.innerHTML = `<div class="fade"><p class="step">${esc(o.name)}</p><h1>${ask}</h1><p class="q">Only if you remember. Jung wants the particular, not the type.</p><input id="who" autofocus placeholder="Name or place" value="${esc(o.who || '')}"><div class="row"><button class="cta" id="ok">${o.who ? 'Save' : 'Keep going'}</button><button class="cta ghost" id="skip">${o.who ? 'Clear' : 'Skip'}</button></div></div>`;
    keep(app.querySelector('#who'), 'who:' + o.slug);
    const done = () => { const v = app.querySelector('#who').value.trim(); snap(); o.who = v; drafts['who:' + o.slug] = v; pendingName = null; render(); };
    app.querySelector('#ok').onclick = done; app.querySelector('#skip').onclick = () => { snap(); o.who = ''; delete drafts['who:' + o.slug]; pendingName = null; render(); };
    app.querySelector('#who').addEventListener('keydown', e => { if (e.key === 'Enter') done(); });
    return;
  }
  if (stage < rounds.length) {
    const r = rounds[stage];
    const used = new Set(picks.map(p => p.slug));
    const cand = SEEDS[r.key].filter(o => !used.has(o.slug) && (!r.slugs || r.slugs.includes(o.slug)));
    const shaped = cand.map(o => r.as && r.as[o.slug] ? { ...o, ...r.as[o.slug] } : o);
    const opts = r.fixed ? shaped.sort((a,b) => r.slugs.indexOf(a.slug) - r.slugs.indexOf(b.slug)) : bestSplit(shaped);
    const left = alive.length || pool().length;
    app.innerHTML = `<div class="fade"><p class="step">${stage+1} of ${rounds.length} · ${left} childhood${left===1?'':'s'} still possible</p><h1>${r.title}</h1><p class="q">${r.q}</p><div class="opts"></div></div>`;
    const box = app.querySelector('.opts');
    for (const o of opts) { const b = el(`<button class="opt"><strong>${o.name}</strong>${o.text}</button>`); b.onclick = () => { snap(); const p = {...o}; picks.push(p); narrow(o); stage++; pendingName = p; render(); }; box.appendChild(b); }
    if (r.key === 'events') { const n = el(`<button class="opt none">None of these</button>`); n.onclick = () => { snap(); stage++; render(); }; box.appendChild(n); }
    return;
  }
  // 3. two stories in the person's own words: money, and where they stood
  if (stage < rounds.length + STORIES.length) { storyStep(STORIES[stage - rounds.length]); return; }
  app.innerHTML = `<div class="fade"><h1>Your first name.</h1><p class="q">It goes at the top of the page you can share.</p><input id="nm" autofocus placeholder="Name" value="${esc(name)}"><button class="cta" id="go">Find my childhood</button></div>`;
  keep(app.querySelector('#nm'), 'name');
  app.querySelector('#go').onclick = () => { snap(); name = app.querySelector('#nm').value.trim() || 'You'; result(); };
}

function brainPage(hit) {
  const slug = 'person-' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const kind = p => isParent(p) ? 'parents' : isSchool(p) ? 'schools' : 'events';
  const who = p => p.who ? ': ' + (isParent(p) ? personLabel(p) : p.who) : '';
  const stories = (money ? `\n## Money story\n${money}\n` : '') + (social ? `\n## Social story\n${social}\n` : '');
  return `# save as brain/people/${slug}.md (gbrain derives the slug from the path)\n---\ntype: person\ntitle: ${name}\ncity: ${city}\n---\n# ${name}\n\nNearest childhood: [[childhoods/${hit.id}]]\n\n## Adapter\n${picks.map(p => `- [[${kind(p)}/${p.slug}]] ${p.name}${who(p)}`).join('\n')}\n${stories}`;
}

let sampler = undefined;
async function getSampler() { if (sampler === undefined) { try { sampler = window.claude ? await claude.use('sample') : null; } catch { sampler = null; } } return sampler; }
function rewritePrompt(hit) {
  const facts = picks.map(p => `- ${p.name}${p.who ? ': ' + (isParent(p) ? personLabel(p) : p.who) : ' (no particular given, keep it generic)'}`).join('\n');
  const people = namedParents().map(p => `- ${personLabel(p)} (the archetype ${name} chose for them: ${p.name})`).join('\n');
  const stories = (money ? `\nMoney story, in ${name}'s own words:\n"""${money}"""\n` : '') + (social ? `\nSocial story, in ${name}'s own words:\n"""${social}"""\n` : '');
  return `Write for ${name}. They grew up in ${city}; mention it once as a plain fact.
Template for rhythm and length only (do NOT keep any of its names, places, jobs, teachers, incidents or feelings):
"""${hit.text}"""
Return JSON only, no prose around it: {"fragment": string, "endings": [string, string, string]}.
"fragment": about ${money || social ? 150 : 110} words, second person, using ONLY the particulars below exactly as given. Hard rules:
- Name people. ${people ? `On the first mention write the full label exactly as listed under People (for example "your dad Carlos"); after that use the name alone. Never write a bare "he", "she", "your father" or "your mother" for a person who has a name below.` : 'No parent was named, so say "your father", "your mother" or "the adult in the house" and never invent a name.'}
- Never invent a person's name. Never invent a teacher, school, street or city not listed.
- Never assume anyone's job or work.
- Never name or invent siblings; if a sibling is mentioned below use only what is given.
- Never state what ${name} thought, felt, decided or feared. Describe only what happened and what could be seen, heard or touched. No inner life.
- Where no particular is given, stay generic ("one teacher", "the school").
${money || social ? '- The money story and the social story below are true and specific. Each becomes one moment of the fragment, keeping every fact and every name in it and adding none. Lightly rewrite them to fit the rhythm.\n' : ''}- No em dashes. No last line about what it left behind; the endings supply that.
"endings": three different candidate closing sentences, each under 14 words, second person, present tense, each a different plausible thing this childhood left in a person. ${name} will choose the one that is true.
${people ? `People:\n${people}\n` : ''}Particulars:
${facts}
${stories}`;
}
async function personalize(hit, node) {
  const s = await getSampler();
  if (!s) return;
  const status = document.getElementById('status'); if (status) status.textContent = 'Jung is rewriting it from your names and stories only.';
  try {
    const out = await s.json(rewritePrompt(hit), { modelTier: 'quick' });
    if (!out || !out.fragment) throw { code: 'bad_json' };
    node.textContent = out.fragment;
    if (status) status.textContent = 'Nothing invented. Now choose the line that is true.';
    const ends = document.getElementById('endings'); if (ends && Array.isArray(out.endings)) {
      ends.innerHTML = '';
      for (const e of out.endings.slice(0,3)) { const b = el(`<button class="opt">${esc(e)}</button>`); b.onclick = () => { node.textContent = out.fragment + ' ' + e; ends.innerHTML = ''; if (status) status.textContent = 'Written from your moments and the line you chose.'; }; ends.appendChild(b); }
      const none = el(`<button class="opt none">None of these are true</button>`); none.onclick = () => { ends.innerHTML = ''; if (status) status.textContent = 'Left without a last line. That is also an answer.'; }; ends.appendChild(none);
    }
  } catch (e) { node.textContent = swapNames(hit.text); if (status) status.textContent = ''; }
}
// Offline fallback: put the names the person gave into the template text. "he" becomes "your dad Carlos", then "Carlos".
function swapNames(text) {
  const who = slug => (picks.find(p => p.slug === slug) || {}).who;
  const swaps = [
    [who('seen'), [/One teacher (kept|told|said)/, /one teacher who (stayed|told|said)/, /one nun knew/, /A teacher, coach, or neighbor/]],
    [who('comparison'), [/Your cousin/, /your cousin/, /your sister/, /your brother/]],
    [who('grandparent'), [/Your grandmother/, /your grandmother/, /Your abuela/, /your abuela/, /your dadi/]],
  ];
  let t = text;
  for (const [nm, res] of swaps) { if (!nm) continue; for (const re of res) { if (re.test(t)) { t = t.replace(re, m => nm + (m.match(/ (kept|told|said|knew|stayed)$/) ? m.slice(m.lastIndexOf(' ')) : '')); break; } } }
  for (const [nm] of swaps) { if (nm && /( and |,|&)/.test(nm)) t = t.split(nm + ' was ').join(nm + ' were '); }
  const np = namedParents();
  const masc = np.find(p => /^(Dad|Stepdad|Grandpa)$/.test(p.role));
  const fem = np.find(p => /^(Mom|Stepmom|Grandma)$/.test(p.role));
  if (np.length >= 2) { const both = np[0].who + ' and ' + np[1].who; t = t.replace(/Both of your parents/, both).replace(/[Bb]oth of your parents/, both).replace(/\b[Yy]our parents\b/, both); }
  const cap = (m, out) => /^[A-Z]/.test(m) ? out[0].toUpperCase() + out.slice(1) : out;
  const sub = (p, re, poss) => {
    if (!p) return;
    let seen = false;
    // If a possessive ("his keys") comes before any other mention, that is the first mention.
    const first = new RegExp(re.source).exec(t), pm = poss.exec(t);
    if (pm && (!first || pm.index < first.index)) { t = t.replace(poss, m => cap(m, personLabel(p, true) + "'s")); seen = true; }
    t = t.replace(re, m => { const out = personLabel(p, !seen); seen = true; return cap(m, out); });
  };
  sub(masc, /\b[Yy]our father\b|\b[Hh]e\b/g, /\b[Hh]is\b/);
  sub(fem, /\b[Yy]our mother\b|\b[Ss]he\b/g, /\b[Hh]er\b(?= [a-z]+)/);
  return t;
}
const served = location.protocol.startsWith('http');
const GEN_CITIES = ["Chicago", "Houston", "the Bay Area", "Miami", "Toronto", "Lima", "Arequipa", "Bogota", "Sao Paulo", "Mumbai", "Delhi", "Chennai", "Lahore", "Shanghai", "Chengdu", "Seoul", "Osaka", "Mexico City", "Guadalajara", "Puebla", "somewhere smaller"];
const localizeCity = t => city ? GEN_CITIES.reduce((s, c) => s.split(c).join(city), t) : t;
const kindOf = p => SEEDS.parents.some(s => s.slug === p.slug) ? 'parents' : SEEDS.schools.some(s => s.slug === p.slug) ? 'schools' : 'events';
async function brainSearch() {
  if (!served) return null;
  try { const r = await fetch('/api/search?q=' + encodeURIComponent(picks.map(p => p.slug + ' ' + p.name).join(' '))); const j = await r.json(); return j.results && j.results[0] ? j.results[0] : null; } catch { return null; }
}
async function savePerson(hit, fragment) {
  if (!served) return;
  if (!name || name === 'You') { const s = document.getElementById('status'); if (s) s.textContent = (s.textContent ? s.textContent + ' · ' : '') + 'Not saved: go back and add your first name.'; return; }
  try { const r = await fetch('/api/person', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, city, picks: picks.map(p => ({ kind: kindOf(p), slug: p.slug, name: p.name, who: p.who ? (isParent(p) ? personLabel(p) : p.who) : '' })), childhood: hit.id, fragment, money, social }) }); const j = await r.json(); const s = document.getElementById('status'); if (s && j.path) s.textContent = (s.textContent ? s.textContent + ' · ' : '') + 'Saved to ' + j.path; } catch {}
}
function result() {
  const hit = match();
  hit.id = hit.id || ('childhood-' + (REPERTOIRE.indexOf(hit)+1).toString().padStart(3,'0'));
  const line = p => esc(p.name) + (p.who ? ' <span class="k">· ' + esc(isParent(p) ? personLabel(p) : p.who) + '</span>' : '');
  app.innerHTML = `<div class="fade">
    <p class="step">${esc(city)}</p>
    <h1>${name && name !== 'You' ? esc(name) + "'s childhood." : 'Your childhood.'}</h1>
    <p class="q">The one that recognized you.</p>
    <p class="frag" id="frag">${esc(swapNames(hit.text))}</p>
    <p class="step" id="status"></p>
    <div class="opts" id="endings" style="margin-bottom:32px"></div>
    <ul class="lora">${picks.map(p => `<li>${line(p)}</li>`).join('')}${money ? `<li><span class="k">Money · </span>${esc(money)}</li>` : ''}${social ? `<li><span class="k">Where you stood · </span>${esc(social)}</li>` : ''}</ul>
    <button class="cta" id="copy">Copy my childhood</button>
    <details><summary>Brain page (for gbrain import)</summary><pre id="bp">${esc(brainPage(hit))}</pre></details>
    <p class="note">This childhood was generated, not retrieved, and rewritten only from the names and stories you gave. The moments above are yours, chosen by recognition. Identity here is parents, a school, and a few life-changing experiences.</p>
  </div>`;
  (async () => {
    const found = await brainSearch();
    if (found && found.text) { hit.id = found.slug.replace(/^.*\//, ''); hit.text = localizeCity(found.text); app.querySelector('#frag').textContent = swapNames(hit.text); app.querySelector('#bp').textContent = brainPage(hit); const s = document.getElementById('status'); if (s) s.textContent = 'Found in GBrain: ' + hit.id; }
    await personalize(hit, app.querySelector('#frag'));
    await savePerson(hit, app.querySelector('#frag').textContent);
  })();
  app.querySelector('#copy').onclick = async () => {
    const txt = `${name}, ${city}\n` + picks.map(p => '· ' + p.name + (p.who ? ' (' + (isParent(p) ? personLabel(p) : p.who) + ')' : '')).join('\n') + (money ? '\n· Money: ' + money : '') + (social ? '\n· Where you stood: ' + social : '') + `\n\n${app.querySelector('#frag').textContent}`;
    try { await navigator.clipboard.writeText(txt); app.querySelector('#copy').textContent = 'Copied'; } catch { prompt('Copy this', txt); }
  };
}
render();
